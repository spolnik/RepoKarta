name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-14
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm --userconfig .npmrc --prefix web ci
      - name: Check and build frontend
        run: |
          npm --prefix web test
          npm --prefix web run typecheck
          git diff --exit-code -- web/src/generated/api-contract.ts
          npm --prefix web run build
      - name: Test Go application
        run: go test -tags "grammar_subset,grammar_subset_bash,grammar_subset_go,grammar_subset_groovy,grammar_subset_java,grammar_subset_javascript,grammar_subset_kotlin,grammar_subset_python,grammar_subset_sql,grammar_subset_tsx,grammar_subset_typescript" ./...
      - name: Build native executable
        run: go build -tags "grammar_subset,grammar_subset_bash,grammar_subset_go,grammar_subset_groovy,grammar_subset_java,grammar_subset_javascript,grammar_subset_kotlin,grammar_subset_python,grammar_subset_sql,grammar_subset_tsx,grammar_subset_typescript" -trimpath ./cmd/repokarta

  handbook:
    name: handbook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: handbook/package-lock.json
      - name: Build visual field guide
        run: |
          npm --prefix handbook ci
          npm --prefix handbook run build

  package-smoke:
    name: package-${{ matrix.name }}
    env:
      PACKAGE_VERSION: 0.96.1-dev
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
          - name: macos-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build frontend
        run: |
          npm --userconfig .npmrc --prefix web ci
          npm --prefix web run build
      - name: Package Windows
        if: matrix.name == 'windows-amd64'
        shell: pwsh
        run: ./scripts/package-release.ps1 -Version $env:PACKAGE_VERSION -OutputDirectory dist/ci-release -SkipValidation
      - name: Package macOS
        if: matrix.name == 'macos-arm64'
        shell: bash
        env:
          REPOKARTA_SKIP_VALIDATION: "1"
        run: ./scripts/package-release.sh "$PACKAGE_VERSION" dist/ci-release
      - name: Boot packaged Windows server
        if: matrix.name == 'windows-amd64'
        shell: pwsh
        run: ./scripts/smoke-package.ps1 -Version $env:PACKAGE_VERSION -OutputDirectory dist/ci-release
      - name: Boot packaged macOS server
        if: matrix.name == 'macos-arm64'
        shell: bash
        run: sh ./scripts/smoke-package.sh "$PACKAGE_VERSION" dist/ci-release

  homebrew:
    name: homebrew-head
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Validate formula style
        run: brew style Formula/repokarta.rb
      - name: Install and test HEAD formula
        run: |
          brew tap spolnik/repokarta https://github.com/spolnik/RepoKarta.git
          brew install --HEAD --build-from-source spolnik/repokarta/repokarta
          brew test spolnik/repokarta/repokarta
